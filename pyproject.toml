[project]
name = "flet-android-notifications-demo"
version = "0.1.0"
description = "Demo app for flet-android-notifications"
requires-python = ">=3.11"
dependencies = [
    "flet>=0.82.0",
    "flet-android-notifications",
]

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true
"android.permission.USE_FULL_SCREEN_INTENT" = true

[tool.flet.app]
exclude = [
    "flet_android_notifications",
    ".env",
    ".git",
    ".venv",
    ".github",
    ".claude",
    "docs",
    "insights",
    "tests",
    "test_resources",
    "example",
    "examples",
    "dist",
    "flet_android_notifications_demo.egg-info",
    "uv.lock",
    "build.py",
    "generate_test_beep.py",
]

[tool.flet.dev_packages]
flet-android-notifications = "flet_android_notifications"
