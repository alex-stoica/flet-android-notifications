name: compatibility

on:
  push:
    branches: [master]
    paths:
      - "**/*.py"
      - "**/*.dart"
      - "**/pubspec.yaml"
      - "**/pyproject.toml"
      - ".github/workflows/compatibility.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.py"
      - "**/*.dart"
      - "**/pubspec.yaml"
      - "**/pyproject.toml"
      - ".github/workflows/compatibility.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flet: ["0.82.0", "0.85.2", "latest"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install matching Flet
        id: versions
        env:
          FLET_VERSION: ${{ matrix.flet }}
        run: |
          requirement=flet
          if [ "$FLET_VERSION" != latest ]; then requirement="flet==$FLET_VERSION"; fi
          python -m pip install "$requirement" pytest ./flet_android_notifications
          python -c "from flet.version import flet_version, flutter_version; print('flet=' + flet_version); print('flutter=' + flutter_version)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m pytest tests -q

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.versions.outputs.flutter }}

      - name: Resolve Flutter extension dependencies
        working-directory: flet_android_notifications/src/flutter/flet_android_notifications
        env:
          FLET_VERSION: ${{ steps.versions.outputs.flet }}
        run: |
          printf 'dependency_overrides:\n  flet: "%s"\n  jni: 1.1.0\n' "$FLET_VERSION" > pubspec_overrides.yaml
          flutter pub get

      - name: Analyze Flutter extension
        working-directory: flet_android_notifications/src/flutter/flet_android_notifications
        run: flutter analyze

      - name: Test Flutter extension
        working-directory: flet_android_notifications/src/flutter/flet_android_notifications
        run: flutter test
